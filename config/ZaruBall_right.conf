# Prospector (status advertisement for prospector scanner, v2.2.3)
# central (right half) 専用: peripheral(left) で有効にすると
# modifiers_state_changed が未定義でリンクエラーになる
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="ZaruBall"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"

CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=5000
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30
