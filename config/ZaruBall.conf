CONFIG_SPI=y
CONFIG_ZMK_POINTING=y

CONFIG_PMW3610=y
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=n
# CONFIG_PMW3610_ORIENTATION_90=y
CONFIG_INPUT=y
# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=0
# CONFIG_PMW3610_SCROLL_TICK=12
# CONFIG_PMW3610_INVERT_SCROLL_X=y
# CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
# CONFIG_PMW3610_CPI=1000

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=500    

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=2
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=3

CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="ZaruBall" 

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_REPORTING=y

# v1.1.1 enhanced power optimization (15x improvement from v1.0)
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
# 10Hz active (was 0.5Hz)
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100   
# 0.03Hz idle (was 0.5Hz)
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000   
 # 10s timeout 
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=10000

# WPM tracking (v1.1.1 new feature)
# 30s window (configurable)
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30     

CONFIG_PROSPECTOR_MAX_LAYERS=4